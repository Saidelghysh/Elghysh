<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأذكار | زاد الآخرة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="offline-fallback" style="display:none; position:fixed; inset:0; z-index:9999; background:#0a1120; color:#f1eee6; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; font-family:'Tajawal',sans-serif;">
  <div style="font-size:3rem; margin-bottom:16px;">🕌</div>
  <h2 style="color:#e3cb8f; margin-bottom:10px; font-size:1.3rem;">عذرًا، حدثت مشكلة في تحميل الموقع</h2>
  <p style="color:#8a93a8; max-width:420px; line-height:1.9; margin-bottom:22px;">
    قد يكون السبب ضعف أو انقطاع في اتصالك بالإنترنت، أو أن الموقع يمر حاليًا بأعمال تحديث وصيانة بسيطة.
    برجاء التأكد من اتصالك بالإنترنت والمحاولة مرة أخرى بعد قليل.
  </p>
  <button onclick="location.reload()" style="background:#c9a961; color:#1a1406; font-weight:700; padding:11px 28px; border-radius:30px; border:none; font-size:.95rem; cursor:pointer; font-family:inherit;">
    🔄 إعادة المحاولة
  </button>
</div>
<script>
  (function(){
    function showFallback(){
      var el = document.getElementById("offline-fallback");
      if(el) el.style.display = "flex";
    }
    setTimeout(function(){
      if(!document.getElementById("app-shell")){ showFallback(); }
    }, 5000);
    window.addEventListener("offline", showFallback);
  })();
</script>


<script>
function renderPage(){
  const c = document.getElementById("page-content");
  c.innerHTML = `
    <div class="page-heading">
      <h1>الأذكار</h1>
      <p>أذكار الصباح والمساء وبعد الصلاة والنوم - مأثورة من القرآن والسنة</p>
    </div>
    <div class="filter-bar" id="azkar-tabs"></div>
    <div id="azkar-list"></div>
  `;

  const tabs = document.getElementById("azkar-tabs");
  const cats = Object.keys(AZKAR_CATEGORIES);
  cats.forEach((cat,idx)=>{
    const b = document.createElement("button");
    b.textContent = cat;
    b.style.cssText = "background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-main);padding:10px 18px;border-radius:20px;font-size:.85rem;";
    b.onclick = ()=>selectCat(cat, b);
    tabs.appendChild(b);
    if(idx===0){ selectCat(cat, b); }
  });

  function selectCat(cat, btn){
    [...tabs.children].forEach(x=>{x.style.background="var(--bg-elevated)"; x.style.color="var(--text-main)";});
    btn.style.background = "var(--gold)"; btn.style.color = "#1a1406";
    const list = document.getElementById("azkar-list");
    list.innerHTML = "";
    let counters = {};
    AZKAR_CATEGORIES[cat].forEach((z,i)=>{
      counters[i] = z.repeat;
      const card = document.createElement("div");
      card.className = "text-card";
      card.innerHTML = `
        <p class="zekr-text">${z.text}</p>
        <div class="meta">
          <span>المصدر: ${z.source}</span>
          <button class="counter-badge" id="cb-${i}">التكرار: <span id="cn-${i}">${z.repeat}</span></button>
        </div>`;
      list.appendChild(card);
      card.querySelector(".counter-badge").onclick = ()=>{
        if(counters[i] > 0){ counters[i]--; document.getElementById("cn-"+i).textContent = counters[i]; }
        if(counters[i] === 0){ card.style.opacity = ".45"; }
      };
    });
  }
}
</script>

<script src="js/quran-data.js"></script>
<script src="js/azkar-data.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
