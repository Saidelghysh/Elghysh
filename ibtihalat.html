<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الابتهالات والتواشيح | زاد الآخرة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="offline-fallback" style="display:none; position:fixed; inset:0; z-index:9999; background:#0a1120; color:#f1eee6; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; font-family:'Tajawal',sans-serif;">
  <div style="font-size:3rem; margin-bottom:16px;">🕌</div>
  <h2 style="color:#e3cb8f; margin-bottom:10px; font-size:1.3rem;">عذرًا، حدثت مشكلة في تحميل الموقع</h2>
  <p style="color:#8a93a8; max-width:420px; line-height:1.9; margin-bottom:22px;">
    قد يكون السبب ضعف أو انقطاع في اتصالك بالإنترنت، أو أن الموقع يمر حاليًا بأعمال تحديث وصيانة بسيطة.
    برجاء التأكد من اتصالك بالإنترنت والمحاولة مرة أخرى بعد قليل.
  </p>
  <button onclick="location.reload()" style="background:#c9a961; color:#1a1406; font-weight:700; padding:11px 28px; border-radius:30px; border:none; font-size:.95rem; cursor:pointer; font-family:inherit;">
    🔄 إعادة المحاولة
  </button>
</div>
<script>
  (function(){
    function showFallback(){
      var el = document.getElementById("offline-fallback");
      if(el) el.style.display = "flex";
    }
    setTimeout(function(){
      if(!document.getElementById("app-shell")){ showFallback(); }
    }, 5000);
    window.addEventListener("offline", showFallback);
  })();
</script>


<script>
function renderPage(){
  const c = document.getElementById("page-content");
  c.innerHTML = `
    <div class="page-heading">
      <h1>الابتهالات والتواشيح</h1>
      <p>ابتهالات نادرة بأصوات كبار المبتهلين: نصر الدين طوبار، سيد النقشبندي، طه الفشني، ومحمد الفيومي</p>
    </div>
    <div class="card-grid" id="ib-grid"></div>
  `;

  const BASE = "https://archive.org/download/54696850/";
  // تسجيلات حقيقية موثقة من أرشيف Internet Archive لكبار المبتهلين
  const items = [
    {title:"حنيني", sheikh:"نصر الدين طوبار", file:"نصر الدين طوبار - حنينى-51090719.mp3"},
    {title:"مجيب السائلين", sheikh:"نصر الدين طوبار", file:"نصر الدين طوبار - مجيب السائلين-51090299.mp3"},
    {title:"هو الله", sheikh:"نصر الدين طوبار", file:"نصر الدين طوبار - هو الله-136057122.mp3"},
    {title:"تواشيح الفجر", sheikh:"نصر الدين طوبار", file:"نصر الدين طوبار - تواشيح الفجر-272740545.mp3"},
    {title:"ربي خلق طه من نور", sheikh:"محمد الفيومي", file:"بي بي سي - الشيخ محمد الفيومي - ربي خلق طه من نور-158519736.mp3"},
    {title:"إنشاد ديني", sheikh:"طه الفشني", file:"بي بي سي المنشد الشيخ طه الفشني في إنشاد ديني-158688114.mp3"},
    {title:"تجميعة من أروع الابتهالات", sheikh:"سيد النقشبندي", file:"تجميعة لمعظم ابتهالات السيد النقشبندي-179585563.mp3"},
    {title:"بين خوف وذلة", sheikh:"سيد النقشبندي", file:"بين خوف وذلة.....سيد النقشبندى-19511160.mp3"},
  ];

  const grid = document.getElementById("ib-grid");
  const queue = items.map(e=>({title:e.title, subtitle:e.sheikh, url: BASE+encodeURIComponent(e.file)}));
  items.forEach((e,idx)=>{
    const card = document.createElement("div");
    card.className = "lib-card";
    card.style.cursor = "pointer";
    card.innerHTML = `
      <div class="thumb" style="background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Ramadan%20Lantern.jpg')"></div>
      <div class="body">
        <h3>${e.title}</h3>
        <p><span>${e.sheikh}</span><span>▶ استماع</span></p>
      </div>`;
    card.onclick = ()=>playQueue(queue, idx);
    grid.appendChild(card);
  });
}
</script>

<script src="js/quran-data.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
