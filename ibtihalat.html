function renderPage(){
  const c = document.getElementById("page-content");
  c.innerHTML = `
    <div class="page-heading">
      <h1>الابتهالات والتواشيح</h1>
      <p>مكتبة ابتهالات حقيقية بأصوات كبار المبتهلين، من أرشيف رقمي عام (Internet Archive)</p>
    </div>
    <div id="ib-wrap"></div>
  `;

  const wrap = document.getElementById("ib-wrap");

  const fullQueue = [];
  IBTIHALAT_LIBRARY.forEach(group=>{
    group.tracks.forEach(t=>{
      fullQueue.push({title:t.title, subtitle:group.munshid, url:t.url});
    });
  });

  let running = 0;
  IBTIHALAT_LIBRARY.forEach(group=>{
    const section = document.createElement("div");
    section.className = "panel-block";
    section.style.marginBottom = "18px";
    section.innerHTML = `
      <div class="panel-block-head">
        <span></span>
        <h3>${group.munshid}</h3>
      </div>
      <div class="list-rows"></div>
    `;
    const rowsWrap = section.querySelector(".list-rows");
    group.tracks.forEach(t=>{
      const idx = running++;
      const row = document.createElement("div");
      row.className = "row-item";
      row.style.cursor = "pointer";
      row.style.display = "flex";
      row.style.alignItems = "center";
      row.style.justifyContent = "space-between";
      row.style.gap = "10px";
      row.innerHTML = `
        <div style="flex:1; min-width:0;" class="row-click">
          <div class="row-title">🎵 ${t.title}</div>
          <div class="row-sub">${group.munshid} — اضغط للاستماع</div>
        </div>
        <a href="${t.url}" target="_blank" rel="noopener" style="flex-shrink:0; font-size:.7rem; color:var(--text-muted); padding:6px 10px; border:1px solid var(--border); border-radius:10px;">فتح مباشر ↗</a>
      `;
      row.querySelector(".row-click").onclick = ()=> playQueue(fullQueue, idx);
      rowsWrap.appendChild(row);
    });
    wrap.appendChild(section);
  });
}
