<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المفضلة | زاد الآخرة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<script>
function renderPage(){
  const c = document.getElementById("page-content");
  c.innerHTML = `
    <div class="page-heading">
      <h1>المفضلة</h1>
      <p>كل ما أضفته إلى المفضلة من تلاوات وسور قرآنية</p>
    </div>
    <div class="list-rows" id="fav-list"></div>
  `;
  const favs = getFavorites();
  const list = document.getElementById("fav-list");
  if(!favs.length){ list.innerHTML = `<div class="empty-msg">لا توجد عناصر في المفضلة بعد. أضف تلاواتك المفضلة من صفحة القرآن الكريم 🤍</div>`; return; }
  favs.forEach((f,idx)=>{
    const row = document.createElement("div");
    row.className = "row-item";
    row.innerHTML = `
      <div class="row-left">
        <div class="row-num">${idx+1}</div>
        <div><div class="row-title">${f.title}</div><div class="row-sub">${f.subtitle||""}</div></div>
      </div>
      <div class="row-play">▶</div>`;
    row.onclick = ()=>playQueue(favs, idx);
    list.appendChild(row);
  });
}
</script>

<script src="js/quran-data.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
