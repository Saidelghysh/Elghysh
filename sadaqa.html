<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صدقة جارية | زاد الآخرة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="offline-fallback" style="display:none; position:fixed; inset:0; z-index:9999; background:#0a1120; color:#f1eee6; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; font-family:'Tajawal',sans-serif;">
  <div style="font-size:3rem; margin-bottom:16px;">🕌</div>
  <h2 style="color:#e3cb8f; margin-bottom:10px; font-size:1.3rem;">عذرًا، حدثت مشكلة في تحميل الموقع</h2>
  <p style="color:#8a93a8; max-width:420px; line-height:1.9; margin-bottom:22px;">
    قد يكون السبب ضعف أو انقطاع في اتصالك بالإنترنت، أو أن الموقع يمر حاليًا بأعمال تحديث وصيانة بسيطة.
    برجاء التأكد من اتصالك بالإنترنت والمحاولة مرة أخرى بعد قليل.
  </p>
  <button onclick="location.reload()" style="background:#c9a961; color:#1a1406; font-weight:700; padding:11px 28px; border-radius:30px; border:none; font-size:.95rem; cursor:pointer; font-family:inherit;">
    🔄 إعادة المحاولة
  </button>
</div>
<script>
  (function(){
    function showFallback(){
      var el = document.getElementById("offline-fallback");
      if(el) el.style.display = "flex";
    }
    setTimeout(function(){
      if(!document.getElementById("app-shell")){ showFallback(); }
    }, 5000);
    window.addEventListener("offline", showFallback);
  })();
</script>


<script>
function renderPage(){
  const c = document.getElementById("page-content");
  c.innerHTML = `
    <section class="hero-banner" style="min-height:220px;">
      <div class="tag">صدقة جارية</div>
      <h2>اجعل ختمة أو دعاءً هدية لمن تحب</h2>
      <p>يمكنك إضافة اسم من ترغب في الدعاء له، ليظهر ضمن قائمة الصدقات الجارية على الصفحة الرئيسية للموقع (خانة إدخال تجريبية - تحتاج ربطها بقاعدة بيانات فعلية).</p>
    </section>
    <div class="text-card">
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <input type="text" id="sadaqa-input" placeholder="اسم المتوفى..." style="flex:1; min-width:220px; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-main); padding:12px 16px; border-radius:10px;">
        <button class="hero-btn" id="sadaqa-add">إضافة دعاء</button>
      </div>
    </div>
    <div class="list-rows" id="sadaqa-list"></div>
  `;
  const PINNED_NAME = "الحاج عبدالحميد إبراهيم الغايش";
  function load(){
    let names = JSON.parse(localStorage.getItem("zad_sadaqa")||"[]");
    names = names.filter(n=>n!==PINNED_NAME);
    names.unshift(PINNED_NAME);
    const list = document.getElementById("sadaqa-list");
    list.innerHTML = "";
    names.forEach(n=>{
      const row = document.createElement("div");
      row.className = "row-item";
      row.innerHTML = `<div class="row-title">🤍 ${n}</div><div class="row-sub">اللهم اجعل هذا العمل نورًا له في قبره</div>`;
      list.appendChild(row);
    });
  }
  document.getElementById("sadaqa-add").onclick = ()=>{
    const v = document.getElementById("sadaqa-input").value.trim();
    if(!v) return;
    let names = JSON.parse(localStorage.getItem("zad_sadaqa")||"[]");
    names.unshift(v);
    localStorage.setItem("zad_sadaqa", JSON.stringify(names));
    document.getElementById("sadaqa-input").value = "";
    load();
    showToast("تقبل الله دعاءك 🤍");
  };
  load();
}
</script>

<script src="js/quran-data.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
