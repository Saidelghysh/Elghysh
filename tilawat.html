<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التلاوات | زاد الآخرة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="offline-fallback" style="display:none; position:fixed; inset:0; z-index:9999; background:#0a1120; color:#f1eee6; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; font-family:'Tajawal',sans-serif;">
  <div style="font-size:3rem; margin-bottom:16px;">🕌</div>
  <h2 style="color:#e3cb8f; margin-bottom:10px; font-size:1.3rem;">عذرًا، حدثت مشكلة في تحميل الموقع</h2>
  <p style="color:#8a93a8; max-width:420px; line-height:1.9; margin-bottom:22px;">
    قد يكون السبب ضعف أو انقطاع في اتصالك بالإنترنت، أو أن الموقع يمر حاليًا بأعمال تحديث وصيانة بسيطة.
    برجاء التأكد من اتصالك بالإنترنت والمحاولة مرة أخرى بعد قليل.
  </p>
  <button onclick="location.reload()" style="background:#c9a961; color:#1a1406; font-weight:700; padding:11px 28px; border-radius:30px; border:none; font-size:.95rem; cursor:pointer; font-family:inherit;">
    🔄 إعادة المحاولة
  </button>
</div>
<script>
  (function(){
    function showFallback(){
      var el = document.getElementById("offline-fallback");
      if(el) el.style.display = "flex";
    }
    setTimeout(function(){
      if(!document.getElementById("app-shell")){ showFallback(); }
    }, 5000);
    window.addEventListener("offline", showFallback);
  })();
</script>


<script>
function renderPage(){
  const c = document.getElementById("page-content");
  c.innerHTML = `
    <div class="page-heading" id="recitations">
      <h1>المكتبة الصوتية - التلاوات</h1>
      <p>مختارات من أجمل التلاوات القرآنية بأصوات نخبة من القراء</p>
    </div>
    <div class="filter-bar">
      <select id="reciter-filter"><option value="">كل القراء</option></select>
    </div>
    <div class="list-rows" id="tilawat-list"></div>
  `;

  const filter = document.getElementById("reciter-filter");
  RECITERS.forEach(r=>{
    const o = document.createElement("option"); o.value=r.id; o.textContent=r.name;
    filter.appendChild(o);
  });

  // مختارات متنوعة (رقم السورة + القارئ)
  const picks = [
    [1,"husr"],[2,"ajm"],[3,"sds"],[18,"jhn"],[19,"afs"],[20,"minsh"],
    [36,"minsh"],[55,"sds"],[56,"husr"],[67,"afs"],[78,"ajm"],[93,"jhn"],
    [97,"husr"],[112,"afs"],[114,"minsh"],[36,"jhn"],[9,"sds"],[12,"husr"]
  ];

  function render(){
    const list = document.getElementById("tilawat-list");
    list.innerHTML = "";
    const fid = filter.value;
    const filtered = picks.filter(p=> !fid || p[1]===fid);
    const queue = filtered.map(([num,rid])=>{
      const r = RECITERS.find(x=>x.id===rid);
      return {title:`سورة ${SURAHS[num-1][0]}`, subtitle:r.name, url:surahAudioUrl(rid,num)};
    });
    if(!filtered.length){ list.innerHTML = `<div class="empty-msg">لا توجد نتائج لهذا القارئ حاليًا</div>`; return; }
    filtered.forEach(([num,rid], idx)=>{
      const r = RECITERS.find(x=>x.id===rid);
      const row = document.createElement("div");
      row.className = "row-item";
      row.innerHTML = `
        <div class="row-left">
          <div class="row-num">${num}</div>
          <div>
            <div class="row-title">سورة ${SURAHS[num-1][0]}</div>
            <div class="row-sub">${r.name}</div>
          </div>
        </div>
        <div class="row-play">▶</div>
      `;
      row.onclick = ()=>playQueue(queue, idx);
      list.appendChild(row);
    });
  }
  filter.onchange = render;
  render();
}
</script>

<script src="js/quran-data.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
