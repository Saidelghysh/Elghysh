      {title:"الحلقة الثانية", url:"https://archive.org/download/alshaarawi/02-alshaarawi-leqaa_aleman.mp3"},
      {title:"الحلقة الثالثة", url:"https://archive.org/download/alshaarawi/03-alshaarawi-leqaa_aleman.mp3"},
      {title:"الحلقة الرابعة", url:"https://archive.org/download/alshaarawi/04-alshaarawi-leqaa_aleman.mp3"},
      {title:"الحلقة الخامسة", url:"https://archive.org/download/alshaarawi/05-alshaarawi-leqaa_aleman.mp3"},
      {title:"الحلقة السادسة", url:"https://archive.org/download/alshaarawi/06-alshaarawi-leqaa_aleman.mp3"},
      {title:"الحلقة السابعة", url:"https://archive.org/download/alshaarawi/07-alshaarawi-leqaa_aleman.mp3"},
      {title:"الحلقة الثامنة", url:"https://archive.org/download/alshaarawi/08-alshaarawi-leqaa_aleman.mp3"},
    ]
  },
  {
    category: "من وصايا الرسول ﷺ",
    tracks: [
      {title:"الوصايا 1-3: السمع والطاعة، حق الجار، وصايا أبي ذر", url:"https://archive.org/download/alshaarawi/alshaarawi-mn_wassaya_alrasol-01.mp3"},
      {title:"الوصايا 4-24: زيارة القبور، حقوق المسلم، اغتنم خمساً قبل خمس", url:"https://archive.org/download/alshaarawi/alshaarawi-mn_wassaya_alrasol-02.mp3"},
      {title:"الوصايا 5-8: الاتباع وترك الابتداع، الذكر بعد الصلاة", url:"https://archive.org/download/alshaarawi/alshaarawi-mn_wassaya_alrasol-03.mp3"},
      {title:"الوصايا 10-15: وصية ابن عباس، مقدمات دخول الجنة", url:"https://archive.org/download/alshaarawi/alshaarawi-mn_wassaya_alrasol-04.mp3"},
      {title:"الوصايا 19-23: أذكار الصباح والمساء، صفات المؤمن", url:"https://archive.org/download/alshaarawi/alshaarawi-mn_wassaya_alrasol-05.mp3"},
      {title:"الوصايا 25-29: بادروا بالأعمال، فضل يوم الجمعة", url:"https://archive.org/download/alshaarawi/alshaarawi-mn_wassaya_alrasol-06.mp3"},
    ]
  },
  {
    category: "دروس ومحاضرات إيمانية",
    tracks: [
      {title:"طيب الأخلاق في الإسلام", url:"https://archive.org/download/alshaarawi/d01-alshaarawi-akhlaq-www.al-mostafa.us.mp3"},
      {title:"في ظلال قصة آدم", url:"https://archive.org/download/alshaarawi/d02-alshaarawi-adam-www.al-mostafa.us.mp3"},
      {title:"خطوط رئيسية في الاقتصاد الإسلامي", url:"https://archive.org/download/alshaarawi/d03-alshaarawi-iqtssad-www.al-mostafa.us.mp3"},

      {title:"القضاء والقدر في الإسلام (الجزء الثاني)", url:"https://archive.org/download/alshaarawi/d05-alshaarawi-qadaa_2-www.al-mostafa.us.mp3"},
      {title:"من صور الإعجاز في القرآن (الجزء الأول)", url:"https://archive.org/download/alshaarawi/d08-alshaarawi-quran_1-www.al-mostafa.us.mp3"},
      {title:"من صور الإعجاز في القرآن (الجزء الثاني)", url:"https://archive.org/download/alshaarawi/d09-alshaarawi-quran_2-www.al-mostafa.us.mp3"},

      {title:"فريضة الحج: شعائر ومشاعر (2)", url:"https://archive.org/download/alshaarawi/d14-alshaarawi-alhaj_2-www.al-mostafa.us.mp3"},

      {title:"التربية في ضوء العلم الحديث", url:"https://archive.org/download/alshaarawi/d17-alshaarawi-altarbia-www.al-mostafa.us.mp3"},
    ]
  },
  {
    category: "برنامج خواطر إيمانية (محمود سلطان)",
    tracks: [
      {title:"الإخلاص", url:"https://archive.org/download/alshaarawi/mahmoud_sultan-alshaarawi-khawater_aymanayah-alekhlas.mp3"},
    ]
  },
];

function renderPage(){
  const c = document.getElementById("page-content");
  c.innerHTML = `
    <div class="page-heading">
      <h1>خواطر الشيخ الشعراوي</h1>
      <p>تسجيلات صوتية حقيقية لخواطر ودروس فضيلة الشيخ محمد متولي الشعراوي رحمه الله، من أرشيف رقمي عام (Internet Archive)</p>
    </div>
    <div id="kw-wrap"></div>
  `;

  const wrap = document.getElementById("kw-wrap");

  const fullQueue = [];
  KHAWATIR_LIBRARY.forEach(group=>{
    group.tracks.forEach(t=>{
      fullQueue.push({title:t.title, subtitle:"الشيخ محمد متولي الشعراوي", url:t.url});
    });
  });

  let running = 0;
  KHAWATIR_LIBRARY.forEach(group=>{
    const section = document.createElement("div");
    section.className = "panel-block";
    section.style.marginBottom = "18px";
    section.innerHTML = `
      <div class="panel-block-head">
        <span></span>
        <h3>${group.category}</h3>
      </div>
      <div class="list-rows"></div>
    `;
    const rowsWrap = section.querySelector(".list-rows");
    group.tracks.forEach(t=>{
      const idx = running++;
      const row = document.createElement("div");
      row.className = "row-item";
      row.style.cursor = "pointer";
      row.style.display = "flex";
      row.style.alignItems = "center";
      row.style.justifyContent = "space-between";
      row.style.gap = "10px";
      row.innerHTML = `
        <div style="flex:1; min-width:0;" class="row-click">
          <div class="row-title">🎙️ ${t.title}</div>
          <div class="row-sub">الشيخ محمد متولي الشعراوي — اضغط للاستماع</div>
        </div>
        <a href="${t.url}" target="_blank" rel="noopener" style="flex-shrink:0; font-size:.7rem; color:var(--text-muted); padding:6px 10px; border:1px solid var(--border); border-radius:10px;">فتح مباشر ↗</a>
      `;
      row.querySelector(".row-click").onclick = ()=> playQueue(fullQueue, idx);
      rowsWrap.appendChild(row);
    });
    wrap.appendChild(section);
  });
}
</script>

<script src="js/quran-data.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
