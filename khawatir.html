<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خواطر الشيخ الشعراوي | زاد الآخرة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<script>
function renderPage(){
  const c = document.getElementById("page-content");
  c.innerHTML = `
    <div class="page-heading">
      <h1>خواطر الشيخ الشعراوي</h1>
      <p>تسجيلات صوتية حقيقية لخواطر ودروس فضيلة الشيخ محمد متولي الشعراوي رحمه الله، من أرشيف رقمي عام (Internet Archive)</p>
    </div>
    <div id="kw-wrap"></div>
  `;

  const wrap = document.getElementById("kw-wrap");

  // قائمة تشغيل واحدة تضم كل المقاطع بالترتيب حتى يعمل "التالي/السابق" بينها كلها
  const fullQueue = [];
  KHAWATIR_LIBRARY.forEach(group=>{
    group.tracks.forEach(t=>{
      fullQueue.push({title:t.title, subtitle:"الشيخ محمد متولي الشعراوي", url:t.url});
    });
  });

  let running = 0;
  KHAWATIR_LIBRARY.forEach(group=>{
    const section = document.createElement("div");
    section.className = "panel-block";
    section.style.marginBottom = "18px";
    section.innerHTML = `
      <div class="panel-block-head">
        <span></span>
        <h3>${group.category}</h3>
      </div>
      <div class="list-rows"></div>
    `;
    const rowsWrap = section.querySelector(".list-rows");
    group.tracks.forEach(t=>{
      const idx = running++;
      const row = document.createElement("div");
      row.className = "row-item";
      row.style.cursor = "pointer";
      row.innerHTML = `<div class="row-title">🎙️ ${t.title}</div><div class="row-sub">الشيخ محمد متولي الشعراوي — اضغط للاستماع</div>`;
      row.onclick = ()=> playQueue(fullQueue, idx);
      rowsWrap.appendChild(row);
    });
    wrap.appendChild(section);
  });
}
</script>

<script src="js/quran-data.js"></script>
<script src="js/khawatir-data.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
