<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زاد الآخرة - خير الزاد ليوم المعاد</title>
<meta name="description" content="زاد الآخرة: منصتك الإسلامية الشاملة للقرآن الكريم، التلاوات، الابتهالات، الأذكار، ومواقيت الصلاة.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<script>
function renderPage(){
  const c = document.getElementById("page-content");
  c.innerHTML = `
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-radio">
          <span class="live-badge"><span class="dot"></span> بث مباشر</span>
          <div class="radio-title">إذاعة القرآن الكريم - مصر</div>
          <div class="radio-now">
            <div class="lbl">استمع الآن</div>
            <h3>إذاعة القرآن الكريم</h3>
            <p>من القاهرة - جمهورية مصر العربية</p>
          </div>
          <div class="radio-controls">
            <button class="radio-play-btn" id="radio-play">▶</button>
            <div class="radio-progress"><i></i></div>
            <span class="radio-quality">جودة عالية <i class="dot-green"></i></span>
          </div>
        </div>
        <div class="hero-text">
          <div class="crescent">🌙</div>
          <h2>السلام عليكم</h2>
          <p>نسأل الله أن يتقبل منا ومنكم صالح الأعمال</p>
        </div>
      </div>
    </section>

    <nav class="quick-access">
      <a href="quran.html"><span class="qa-ico">📖</span><span>القرآن الكريم</span></a>
      <a href="tilawat.html"><span class="qa-ico">🎙️</span><span>التلاوات النادرة</span></a>
      <a href="ibtihalat.html"><span class="qa-ico">🎵</span><span>الابتهالات</span></a>
      <a href="external.html"><span class="qa-ico">🕌</span><span>حفلات خارجية</span></a>
      <a href="#prayer-panel"><span class="qa-ico">🕋</span><span>مواقيت الصلاة</span></a>
      <a href="azkar.html"><span class="qa-ico">📿</span><span>الأذكار</span></a>
      <a href="sadaqa.html"><span class="qa-ico">💚</span><span>الصدقة الجارية</span></a>
      <a href="settings.html"><span class="qa-ico">⋯</span><span>المزيد</span></a>
    </nav>

    <div class="dashboard-grid">
      <aside class="dash-col">
        <div class="panel">
          <h3>أذكار اليوم</h3>
          <div class="azkar-mini" style="margin-top:12px">
            <div class="azkar-cat" id="azkar-cat">أذكار الصباح</div>
            <p class="azkar-text" id="azkar-text">جارٍ التحميل...</p>
            <div class="azkar-source" id="azkar-source"></div>
            <div class="azkar-nav">
              <button id="azkar-next">›</button>
              <span class="count" id="azkar-count">1/10</span>
              <button id="azkar-prev">‹</button>
            </div>
          </div>
          <button class="show-all-btn" onclick="location.href='azkar.html'">عرض كل الأذكار</button>
        </div>

        <div class="sadaqa-panel">
          <div class="sadaqa-ico">💚</div>
          <div>
            <h3 id="sadaqa-name">الصدقة الجارية</h3>
            <button class="sadaqa-btn" id="dua-btn">ابدأ الآن</button>
          </div>
        </div>
      </aside>

      <section class="dash-col">
        <div class="panel-block">
          <div class="panel-block-head">
            <a href="external.html" class="see-all">عرض الكل</a>
            <h3>حفلات خارجية</h3>
          </div>
          <a class="media-card" href="external.html" style="background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Great%20Mosque%20of%20Mecca%20at%20night.jpg')">
            <span class="media-caption">حفل الشيخ عبدالباسط عبدالصمد - ليبيا 1984</span>
          </a>
        </div>
        <div class="panel-block">
          <div class="panel-block-head">
            <a href="tilawat.html" class="see-all">عرض الكل</a>
            <h3>ليالي رمضان</h3>
          </div>
          <a class="media-card ramadan" href="tilawat.html" style="background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Ramadan%20Lantern.jpg')">
            <div class="mc-eyebrow">تلاوات وقيام الليل</div>
            <div class="mc-title">ليالي رمضان</div>
            <div class="mc-sub">أجمل التلاوات في ليالي رمضان المباركة</div>
          </a>
        </div>
      </section>

      <section class="dash-col">
        <div class="panel-block">
          <div class="panel-block-head">
            <a href="tilawat.html" class="see-all">عرض الكل</a>
            <h3>التلاوات النادرة</h3>
          </div>
          <div class="reciter-grid" id="rare-recitations"></div>
        </div>
        <div class="panel-block">
          <div class="panel-block-head">
            <a href="ibtihalat.html" class="see-all">عرض الكل</a>
            <h3>الابتهالات</h3>
          </div>
          <div class="reciter-grid" id="ibtihalat-grid"></div>
        </div>
      </section>

      <aside class="dash-col">
        <div class="panel" id="prayer-panel">
          <h3>مواقيت الصلاة</h3>
          <div class="sub" id="prayer-location">جارٍ تحديد الموقع...</div>
          <div class="prayer-list" id="prayer-list">
            <div class="empty-msg">جارٍ تحميل المواقيت...</div>
          </div>
          <button class="show-all-btn" onclick="location.href='adhan.html'">عرض جميع المواقيت</button>
        </div>
      </aside>
    </div>
  `;

  document.getElementById("dua-btn").onclick = ()=>showToast("اللهم تقبل، آمين 🤍");

  // صدقة جارية
  const sadaqaNames = ["عبد الحميد إبراهيم الغايش"];
  document.getElementById("sadaqa-name").textContent = sadaqaNames[0];

  // التلاوات النادرة (قراء مختارون)
  const rareReciters = [
    {name:"عبد الباسط عبد الصمد", reciterId:"jhn", num:18},
    {name:"محمد صديق المنشاوي", reciterId:"minsh", num:36},
    {name:"محمود خليل الحصري", reciterId:"husr", num:67},
    {name:"مصطفى إسماعيل", reciterId:"ajm", num:55},
    {name:"محمد رفعت", reciterId:"sds", num:2},
  ];
  const rareWrap = document.getElementById("rare-recitations");
  rareReciters.forEach(r=>{
    const url = surahAudioUrl(r.reciterId, r.num);
    const el = document.createElement("div");
    el.className = "reciter-card";
    el.innerHTML = `
      <div class="reciter-avatar">🎙️<span class="play-dot">▶</span></div>
      <div class="r-name">${r.name}</div>`;
    el.onclick = ()=>playSingle(r.name, "تلاوة نادرة", url);
    rareWrap.appendChild(el);
  });

  // الابتهالات (تصنيف تعريفي - يمكن ربطه لاحقًا بصفحة الابتهالات)
  const munshids = ["نصر الدين طوبار", "الشيخ النقشبندي", "محمد عمران", "علي محمود", "طه الفشني"];
  const ibtWrap = document.getElementById("ibtihalat-grid");
  munshids.forEach(name=>{
    const el = document.createElement("div");
    el.className = "reciter-card";
    el.innerHTML = `
      <div class="reciter-avatar">🎵<span class="play-dot">▶</span></div>
      <div class="r-name">${name}</div>`;
    el.onclick = ()=>location.href="ibtihalat.html";
    ibtWrap.appendChild(el);
  });

  // أذكار اليوم (widget)
  const azkarList = (typeof AZKAR_CATEGORIES !== "undefined") ? AZKAR_CATEGORIES["أذكار الصباح"] : [];
  let azkarIndex = 0;
  function renderAzkar(){
    if(!azkarList.length) return;
    const item = azkarList[azkarIndex];
    document.getElementById("azkar-text").textContent = item.text;
    document.getElementById("azkar-source").textContent = `(رواه ${item.source})`;
    document.getElementById("azkar-count").textContent = `${azkarIndex+1}/${azkarList.length}`;
  }
  renderAzkar();
  document.getElementById("azkar-next").onclick = ()=>{
    azkarIndex = (azkarIndex+1) % azkarList.length; renderAzkar();
  };
  document.getElementById("azkar-prev").onclick = ()=>{
    azkarIndex = (azkarIndex-1+azkarList.length) % azkarList.length; renderAzkar();
  };
}
</script>

<script src="js/quran-data.js"></script>
<script src="js/azkar-data.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
