<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>زاد الآخرة - خير الزاد ليوم المعاد</title>
<meta name="description" content="زاد الآخرة: منصتك الإسلامية الشاملة للقرآن الكريم، التلاوات، الابتهالات، الأذكار، ومواقيت الصلاة.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<script>
function renderPage(){
  const c = document.getElementById("page-content");
  c.innerHTML = `
    <section class="hero-banner">
      <div class="tag">صدقة جارية</div>
      <h2 id="sadaqa-name">جارٍ التحميل...</h2>
      <p>اللهم اجعل هذا العمل نورًا له في قبره ورفعة في درجاته، واجعلنا وإياه من أهل الفردوس الأعلى</p>
      <button class="hero-btn" id="dua-btn">🤍 الدعاء للوالد</button>
    </section>

    <section class="block">
      <h2 class="block-title">المكتبة الرئيسية</h2>
      <div class="card-grid">
        <a class="lib-card" href="quran.html">
          <div class="thumb" style="background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Open%20Quran%20close%20up.jpg')"></div>
          <div class="body"><h3>القرآن والتلاوات</h3><p><span>استمع لتلاوات القرآن الكريم</span><span>114 سورة</span></p></div>
        </a>
        <a class="lib-card" href="external.html">
          <div class="thumb" style="background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Microphone%20on%20stage.jpg')"></div>
          <div class="body"><h3>حفلات خارجية</h3><p><span>تسجيلات صوتية نادرة</span><span>للشيوخ الكبار</span></p></div>
        </a>
        <a class="lib-card" href="ibtihalat.html">
          <div class="thumb" style="background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Ramadan%20Lantern.jpg')"></div>
          <div class="body"><h3>الابتهالات والتواشيح</h3><p><span>ابتهالات ومدائح نبوية</span><span>أصوات عذبة</span></p></div>
        </a>
        <a class="lib-card" href="khawatir.html">
          <div class="thumb" style="background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Old%20book%20and%20glasses.jpg')"></div>
          <div class="body"><h3>خواطر الشعراوي</h3><p><span>خواطر إيمانية رائعة</span><span>للشيخ الشعراوي</span></p></div>
        </a>
      </div>
    </section>

    <section class="block">
      <h2 class="block-title">آخر التلاوات المضافة</h2>
      <div class="hscroll" id="recent-recitations"></div>
    </section>
  `;

  document.getElementById("dua-btn").onclick = ()=>showToast("اللهم تقبل، آمين 🤍");

  // صدقة جارية - تدوير أسماء توضيحية (نص تجريبي يمكن ربطه بقاعدة بيانات حقيقية لاحقًا)
  const sadaqaNames = ["عبد الحميد إبراهيم الغايش", "عبدالحميد ابراهيم الغايش", "عبدالحميد ابراهيم الغايش"];
  document.getElementById("sadaqa-name").textContent = sadaqaNames[Math.floor(Math.random()*sadaqaNames.length)];

  // آخر التلاوات
  const featured = [
    {name:"سورة البقرة", reciter:"ماهر المعيقلي", num:2, reciterId:"ajm", dur:"1:45:23"},
    {name:"سورة الكهف", reciter:"عبدالباسط عبدالصمد", num:18, reciterId:"jhn", dur:"00:40:12"},
    {name:"سورة الرحمن", reciter:"سعد الغامدي", num:55, reciterId:"sds", dur:"00:20:15"},
    {name:"سورة الملك", reciter:"مشاري العفاسي", num:67, reciterId:"afs", dur:"00:11:18"},
    {name:"سورة يس", reciter:"محمد المنشاوي", num:36, reciterId:"minsh", dur:"00:23:34"},
  ];
  const wrap = document.getElementById("recent-recitations");
  featured.forEach(f=>{
    const url = surahAudioUrl(f.reciterId, f.num);
    const el = document.createElement("div");
    el.className = "rec-card";
    el.innerHTML = `
      <div class="thumb" style="background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Quran%20calligraphy.jpg')">
        <div class="playbtn">▶</div>
      </div>
      <div class="body">
        <h4>${f.name}</h4>
        <p><span>${f.reciter}</span><span>${f.dur}</span></p>
      </div>`;
    el.onclick = ()=>playSingle(f.name, f.reciter, url);
    wrap.appendChild(el);
  });
}
</script>

<script src="js/quran-data.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
