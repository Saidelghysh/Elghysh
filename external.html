<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حفلات خارجية | زاد الآخرة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<script>
function renderPage(){
  const c = document.getElementById("page-content");
  c.innerHTML = `
    <div class="page-heading">
      <h1>حفلات خارجية</h1>
      <p>تسجيلات نادرة بأصوات كبار قراء العصر الذهبي للتلاوة المصرية</p>
    </div>
    <div class="card-grid" id="ext-grid"></div>
    <p style="color:var(--text-muted); font-size:.82rem; margin-top:20px; text-align:center;">
      ملاحظة: الشيخ محمد الليثي والشيخ شعبان الصياد رحمهما الله ليس لهما حاليًا مصدر برمجي مجاني موثوق برابط مباشر،
      لذلك لم يُدرجا هنا تلقائيًا. تسجيلاتهما النادرة متاحة يدويًا على archive.org ويمكن إضافتها لاحقًا.
    </p>
  `;

  const events = [
    {title:"مجلس قرآني نادر - سورة يوسف", reciterId:"husr_mojawwad", num:12, place:"محمود خليل الحصري"},
    {title:"حفل تاريخي - سورة الإسراء", reciterId:"minsh_mojawwad", num:17, place:"محمد صديق المنشاوي"},
    {title:"تلاوة مجودة - سورة مريم", reciterId:"jhn", num:19, place:"عبدالباسط عبدالصمد"},
    {title:"أمسية قرآنية - سورة الفرقان", reciterId:"tblawi", num:25, place:"محمد الطبلاوي"},
    {title:"تسجيل إذاعي نادر - سورة الأحزاب", reciterId:"mustafa", num:33, place:"مصطفى إسماعيل"},
    {title:"مجلس تلاوة - سورة الدخان", reciterId:"husr_mojawwad", num:44, place:"محمود خليل الحصري"},
    {title:"حفل ختم القرآن - سورة يس", reciterId:"minsh_mojawwad", num:36, place:"محمد صديق المنشاوي"},
    {title:"تلاوة خاشعة - سورة الرحمن", reciterId:"tblawi", num:55, place:"محمد الطبلاوي"},
  ];

  const grid = document.getElementById("ext-grid");
  const queue = events.map(e=>({title:e.title, subtitle:RECITERS.find(r=>r.id===e.reciterId).name, url:surahAudioUrl(e.reciterId,e.num)}));
  events.forEach((e,idx)=>{
    const r = RECITERS.find(x=>x.id===e.reciterId);
    const card = document.createElement("div");
    card.className = "lib-card";
    card.innerHTML = `
      <div class="thumb" style="background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Microphone%20on%20stage.jpg')"></div>
      <div class="body">
        <h3>${e.title}</h3>
        <p><span>${r.name}</span><span>▶ استماع</span></p>
      </div>`;
    card.onclick = ()=>playQueue(queue, idx);
    card.style.cursor = "pointer";
    grid.appendChild(card);
  });
}
</script>

<script src="js/quran-data.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
