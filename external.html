<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حفلات خارجية | زاد الآخرة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<script>
function renderPage(){
  const c = document.getElementById("page-content");
  c.innerHTML = `
    <div class="page-heading">
      <h1>حفلات خارجية</h1>
      <p>تسجيلات حفلات ومجالس نادرة بأصوات كبار قراء العصر الذهبي للتلاوة المصرية</p>
    </div>

    <h2 class="block-title" style="text-align:right; font-size:1.05rem;">الشيخ محمد الليثي رحمه الله - تسجيلات نادرة</h2>
    <div class="list-rows" id="laithi-list" style="margin-bottom:30px;"></div>

    <h2 class="block-title" style="text-align:right; font-size:1.05rem;">الشيخ محمود علي البنا رحمه الله - المصحف المجود كاملًا (أسلوب الحفلات)</h2>
    <div class="filter-bar">
      <input type="text" id="banna-search" placeholder="ابحث عن سورة من تلاوات البنا...">
    </div>
    <div class="list-rows" id="banna-list" style="margin-bottom:30px;"></div>

    <h2 class="block-title" style="text-align:right; font-size:1.05rem;">قراء الحفلات الكبار - تلاوات مجودة مختارة</h2>
    <div class="card-grid" id="ext-grid"></div>
  `;

  // ------- الشيخ محمد الليثي: تسجيلات حقيقية نادرة -------
  const laithiQueue = LAITHI_TRACKS.map(t=>({title:t.title, subtitle:"الشيخ محمد الليثي", url:LAITHI_BASE+t.file}));
  const laithiList = document.getElementById("laithi-list");
  LAITHI_TRACKS.forEach((t,idx)=>{
    const row = document.createElement("div");
    row.className = "row-item";
    row.innerHTML = `
      <div class="row-left">
        <div class="row-num">${idx+1}</div>
        <div><div class="row-title">${t.title}</div><div class="row-sub">الشيخ محمد الليثي - تسجيل نادر</div></div>
      </div>
      <div class="row-play">▶</div>`;
    row.onclick = ()=>playQueue(laithiQueue, idx);
    laithiList.appendChild(row);
  });

  // ------- الشيخ محمود علي البنا: المصحف المجود كاملًا -------
  function renderBanna(filter=""){
    const list = document.getElementById("banna-list");
    list.innerHTML = "";
    const queue = SURAHS.map((s,i)=>({title:`سورة ${s[0]}`, subtitle:"محمود علي البنا (مجود)", url:surahAudioUrl("banna_mojawwad", i+1)}));
    SURAHS.forEach((s,i)=>{
      if(filter && !s[0].includes(filter)) return;
      const num = i+1;
      const row = document.createElement("div");
      row.className = "row-item";
      row.innerHTML = `
        <div class="row-left">
          <div class="row-num">${num}</div>
          <div><div class="row-title">سورة ${s[0]}</div><div class="row-sub">محمود علي البنا - مجود</div></div>
        </div>
        <div class="row-play">▶</div>`;
      row.onclick = ()=>playQueue(queue, num-1);
      list.appendChild(row);
    });
  }
  document.getElementById("banna-search").oninput = (e)=>renderBanna(e.target.value);
  renderBanna();

  // ------- قراء حفلات آخرون (نسخ مجودة من mp3quran) -------
  const events = [
    {title:"مجلس قرآني نادر - سورة يوسف", reciterId:"husr_mojawwad", num:12},
    {title:"حفل تاريخي - سورة الإسراء", reciterId:"minsh_mojawwad", num:17},
    {title:"تلاوة مجودة - سورة مريم", reciterId:"jhn", num:19},
    {title:"أمسية قرآنية - سورة الفرقان", reciterId:"tblawi", num:25},
    {title:"تسجيل إذاعي نادر - سورة الأحزاب", reciterId:"mustafa", num:33},
    {title:"مجلس تلاوة - سورة الدخان", reciterId:"husr_mojawwad", num:44},
    {title:"حفل ختم القرآن - سورة يس", reciterId:"minsh_mojawwad", num:36},
    {title:"تلاوة خاشعة - سورة الرحمن", reciterId:"tblawi", num:55},
  ];
  const grid = document.getElementById("ext-grid");
  const queue2 = events.map(e=>({title:e.title, subtitle:RECITERS.find(r=>r.id===e.reciterId).name, url:surahAudioUrl(e.reciterId,e.num)}));
  events.forEach((e,idx)=>{
    const r = RECITERS.find(x=>x.id===e.reciterId);
    const card = document.createElement("div");
    card.className = "lib-card";
    card.style.cursor = "pointer";
    card.innerHTML = `
      <div class="thumb" style="background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Microphone%20on%20stage.jpg')"></div>
      <div class="body">
        <h3>${e.title}</h3>
        <p><span>${r.name}</span><span>▶ استماع</span></p>
      </div>`;
    card.onclick = ()=>playQueue(queue2, idx);
    grid.appendChild(card);
  });
}
</script>

<script src="js/quran-data.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
