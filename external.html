<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حفلات خارجية | زاد الآخرة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="offline-fallback" style="display:none; position:fixed; inset:0; z-index:9999; background:#0a1120; color:#f1eee6; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; font-family:'Tajawal',sans-serif;">
  <div style="font-size:3rem; margin-bottom:16px;">🕌</div>
  <h2 style="color:#e3cb8f; margin-bottom:10px; font-size:1.3rem;">عذرًا، حدثت مشكلة في تحميل الموقع</h2>
  <p style="color:#8a93a8; max-width:420px; line-height:1.9; margin-bottom:22px;">
    قد يكون السبب ضعف أو انقطاع في اتصالك بالإنترنت، أو أن الموقع يمر حاليًا بأعمال تحديث وصيانة بسيطة.
    برجاء التأكد من اتصالك بالإنترنت والمحاولة مرة أخرى بعد قليل.
  </p>
  <button onclick="location.reload()" style="background:#c9a961; color:#1a1406; font-weight:700; padding:11px 28px; border-radius:30px; border:none; font-size:.95rem; cursor:pointer; font-family:inherit;">
    🔄 إعادة المحاولة
  </button>
</div>
<script>
  (function(){
    function showFallback(){
      var el = document.getElementById("offline-fallback");
      if(el) el.style.display = "flex";
    }
    setTimeout(function(){
      if(!document.getElementById("app-shell")){ showFallback(); }
    }, 5000);
    window.addEventListener("offline", showFallback);
  })();
</script>


<script>
function renderPage(){
  const c = document.getElementById("page-content");
  c.innerHTML = `
    <div class="page-heading">
      <h1>حفلات خارجية</h1>
      <p>تسجيلات حفلات ومجالس نادرة بأصوات كبار قراء العصر الذهبي للتلاوة المصرية</p>
    </div>
    <div class="card-grid" id="ext-grid"></div>
  `;

  // الشيخ محمد الليثي: تسجيلات نادرة حقيقية
  const laithiItems = LAITHI_TRACKS.map(t=>({
    title:"الليثي - " + t.title, reciter:"الشيخ محمد الليثي", url: LAITHI_BASE + t.file
  }));

  // الشيخ محمود علي البنا: مختارات من المصحف المجود الكامل (أسلوب الحفلات)
  const bannaPicks = [12,18,19,36,55,67].map(num=>({
    title:"البنا - سورة " + SURAHS[num-1][0], reciter:"محمود علي البنا (مجود)",
    url: surahAudioUrl("banna_mojawwad", num)
  }));

  // قراء حفلات آخرون (نسخ مجودة حقيقية من mp3quran)
  const others = [
    {title:"مجلس قرآني نادر - سورة يوسف", reciterId:"husr_mojawwad", num:12},
    {title:"حفل تاريخي - سورة الإسراء", reciterId:"minsh_mojawwad", num:17},
    {title:"تلاوة مجودة - سورة مريم", reciterId:"jhn", num:19},
    {title:"أمسية قرآنية - سورة الفرقان", reciterId:"tblawi", num:25},
    {title:"تسجيل إذاعي نادر - سورة الأحزاب", reciterId:"mustafa", num:33},
    {title:"حفل ختم القرآن - سورة يس", reciterId:"minsh_mojawwad", num:36},
  ].map(e=>({title:e.title, reciter:RECITERS.find(r=>r.id===e.reciterId).name, url:surahAudioUrl(e.reciterId,e.num)}));

  const all = [...laithiItems, ...bannaPicks, ...others];
  const queue = all.map(e=>({title:e.title, subtitle:e.reciter, url:e.url}));

  const grid = document.getElementById("ext-grid");
  all.forEach((e,idx)=>{
    const card = document.createElement("div");
    card.className = "lib-card";
    card.style.cursor = "pointer";
    card.innerHTML = `
      <div class="thumb" style="background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Microphone%20on%20stage.jpg')"></div>
      <div class="body">
        <h3>${e.title}</h3>
        <p><span>${e.reciter}</span><span>▶ استماع</span></p>
      </div>`;
    card.onclick = ()=>playQueue(queue, idx);
    grid.appendChild(card);
  });
}
</script>

<script src="js/quran-data.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
