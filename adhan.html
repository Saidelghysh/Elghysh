<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأذان | زاد الآخرة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="offline-fallback" style="display:none; position:fixed; inset:0; z-index:9999; background:#0a1120; color:#f1eee6; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; font-family:'Tajawal',sans-serif;">
  <div style="font-size:3rem; margin-bottom:16px;">🕌</div>
  <h2 style="color:#e3cb8f; margin-bottom:10px; font-size:1.3rem;">عذرًا، حدثت مشكلة في تحميل الموقع</h2>
  <p style="color:#8a93a8; max-width:420px; line-height:1.9; margin-bottom:22px;">
    قد يكون السبب ضعف أو انقطاع في اتصالك بالإنترنت، أو أن الموقع يمر حاليًا بأعمال تحديث وصيانة بسيطة.
    برجاء التأكد من اتصالك بالإنترنت والمحاولة مرة أخرى بعد قليل.
  </p>
  <button onclick="location.reload()" style="background:#c9a961; color:#1a1406; font-weight:700; padding:11px 28px; border-radius:30px; border:none; font-size:.95rem; cursor:pointer; font-family:inherit;">
    🔄 إعادة المحاولة
  </button>
</div>
<script>
  (function(){
    function showFallback(){
      var el = document.getElementById("offline-fallback");
      if(el) el.style.display = "flex";
    }
    setTimeout(function(){
      if(!document.getElementById("app-shell")){ showFallback(); }
    }, 5000);
    window.addEventListener("offline", showFallback);
  })();
</script>


<script>
function renderPage(){
  const c = document.getElementById("page-content");
  c.innerHTML = `
    <div class="page-heading">
      <h1>الأذان</h1>
      <p>استمع لصوت الأذان بأصوات مختلفة من المؤذنين</p>
    </div>
    <div class="card-grid" id="adhan-grid"></div>
  `;

  const items = [
    {title:"أذان 1", url:"https://www.islamcan.com/audio/adhan/azan1.mp3"},
    {title:"أذان 2", url:"https://www.islamcan.com/audio/adhan/azan2.mp3"},
    {title:"أذان 3", url:"https://www.islamcan.com/audio/adhan/azan3.mp3"},
    {title:"أذان 4", url:"https://www.islamcan.com/audio/adhan/azan4.mp3"},
  ];

  const grid = document.getElementById("adhan-grid");
  const queue = items.map(e=>({title:e.title, subtitle:"الأذان", url:e.url}));
  items.forEach((e,idx)=>{
    const card = document.createElement("div");
    card.className = "lib-card";
    card.style.cursor = "pointer";
    card.innerHTML = `
      <div class="thumb" style="background-image:url('https://commons.wikimedia.org/wiki/Special:FilePath/Blue%20Mosque%20Minaret.jpg'); display:flex; align-items:center; justify-content:center; font-size:2.4rem;">🕌</div>
      <div class="body"><h3>${e.title}</h3><p><span>صوت المؤذن</span><span>▶ استماع</span></p></div>`;
    card.onclick = ()=>playQueue(queue, idx);
    grid.appendChild(card);
  });
}
</script>

<script src="js/quran-data.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
