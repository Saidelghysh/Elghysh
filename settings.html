<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعدادات | زاد الآخرة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="offline-fallback" style="display:none; position:fixed; inset:0; z-index:9999; background:#0a1120; color:#f1eee6; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; font-family:'Tajawal',sans-serif;">
  <div style="font-size:3rem; margin-bottom:16px;">🕌</div>
  <h2 style="color:#e3cb8f; margin-bottom:10px; font-size:1.3rem;">عذرًا، حدثت مشكلة في تحميل الموقع</h2>
  <p style="color:#8a93a8; max-width:420px; line-height:1.9; margin-bottom:22px;">
    قد يكون السبب ضعف أو انقطاع في اتصالك بالإنترنت، أو أن الموقع يمر حاليًا بأعمال تحديث وصيانة بسيطة.
    برجاء التأكد من اتصالك بالإنترنت والمحاولة مرة أخرى بعد قليل.
  </p>
  <button onclick="location.reload()" style="background:#c9a961; color:#1a1406; font-weight:700; padding:11px 28px; border-radius:30px; border:none; font-size:.95rem; cursor:pointer; font-family:inherit;">
    🔄 إعادة المحاولة
  </button>
</div>
<script>
  (function(){
    function showFallback(){
      var el = document.getElementById("offline-fallback");
      if(el) el.style.display = "flex";
    }
    setTimeout(function(){
      if(!document.getElementById("app-shell")){ showFallback(); }
    }, 5000);
    window.addEventListener("offline", showFallback);
  })();
</script>


<script>
function renderPage(){
  const c = document.getElementById("page-content");
  c.innerHTML = `
    <div class="page-heading">
      <h1>الإعدادات</h1>
      <p>خصّص تجربتك داخل زاد الآخرة</p>
    </div>
    <div class="text-card">
      <h3 style="color:var(--gold-light); margin-bottom:14px;">القارئ الافتراضي</h3>
      <select id="default-reciter" style="width:100%; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-main); padding:12px 16px; border-radius:10px;"></select>
    </div>
    <div class="text-card">
      <h3 style="color:var(--gold-light); margin-bottom:10px;">الموقع (لحساب مواقيت الصلاة)</h3>
      <p style="color:var(--text-muted); font-size:.85rem; margin-bottom:14px;" id="current-location-label">جارٍ التحقق...</p>
      <div style="display:flex; gap:8px; margin-bottom:10px;">
        <input id="location-search" placeholder="اكتب اسم المدينة (مثال: القاهرة، الرياض، دبي)" style="flex:1; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-main); padding:12px 16px; border-radius:10px;">
        <button id="location-search-btn" class="hero-btn">بحث</button>
      </div>
      <button id="use-gps-btn" style="width:100%; padding:11px; border-radius:10px; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-main); font-weight:700;">📍 استخدام موقعي الحالي (GPS)</button>
    </div>
    <div class="text-card">
      <h3 style="color:var(--gold-light); margin-bottom:14px;">طريقة حساب مواقيت الصلاة</h3>
      <select id="calc-method" style="width:100%; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-main); padding:12px 16px; border-radius:10px;">
        <option value="4">أم القرى - مكة المكرمة</option>
        <option value="5">الهيئة المصرية العامة للمساحة</option>
        <option value="2">الجمعية الإسلامية لأمريكا الشمالية (ISNA)</option>
        <option value="3">رابطة العالم الإسلامي</option>
      </select>
    </div>
    <div class="text-card">
      <h3 style="color:var(--gold-light); margin-bottom:10px;">إفراغ بيانات الموقع المحلية</h3>
      <p style="color:var(--text-muted); font-size:.85rem; margin-bottom:14px;">يحذف هذا الخيار قائمة المفضلة وأسماء الصدقة الجارية المحفوظة في متصفحك فقط.</p>
      <button class="hero-btn" id="clear-data">حذف البيانات المحلية</button>
    </div>
  `;

  const sel = document.getElementById("default-reciter");
  RECITERS.forEach(r=>{ const o=document.createElement("option"); o.value=r.id; o.textContent=r.name; sel.appendChild(o); });
  sel.value = localStorage.getItem("zad_default_reciter") || RECITERS[0].id;
  sel.onchange = ()=>{ localStorage.setItem("zad_default_reciter", sel.value); showToast("تم الحفظ"); };

  // ---- الموقع (لحساب مواقيت الصلاة) ----
  function renderCurrentLocationLabel(){
    const lbl = document.getElementById("current-location-label");
    if(!lbl) return;
    const saved = localStorage.getItem("zad_location");
    if(saved){
      try{
        const loc = JSON.parse(saved);
        lbl.textContent = "الموقع الحالي: " + (loc.label || "محفوظ يدويًا");
      }catch(e){ lbl.textContent = "الموقع الحالي: تحديد تلقائي (GPS)"; }
    } else {
      lbl.textContent = "الموقع الحالي: تحديد تلقائي (GPS)";
    }
  }
  renderCurrentLocationLabel();

  const searchBtn = document.getElementById("location-search-btn");
  const searchInput = document.getElementById("location-search");
  async function doLocationSearch(){
    const q = searchInput.value.trim();
    if(!q){ showToast("اكتب اسم مدينة أولاً"); return; }
    searchBtn.textContent = "جارٍ البحث...";
    searchBtn.disabled = true;
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ar&q=${encodeURIComponent(q)}`);
      const data = await res.json();
      if(!data || !data.length){
        showToast("لم يتم العثور على هذا المكان، جرّب اسمًا مختلفًا");
      } else {
        const place = data[0];
        const loc = {
          label: (place.display_name || q).split(",")[0].trim(),
          lat: parseFloat(place.lat),
          lng: parseFloat(place.lon)
        };
        localStorage.setItem("zad_location", JSON.stringify(loc));
        renderCurrentLocationLabel();
        showToast("تم حفظ الموقع: " + loc.label + " — سيُطبَّق في الصفحة الرئيسية");
        searchInput.value = "";
      }
    }catch(e){
      showToast("تعذّر البحث، تحقق من اتصال الإنترنت");
    }
    searchBtn.textContent = "بحث";
    searchBtn.disabled = false;
  }
  searchBtn.onclick = doLocationSearch;
  searchInput.addEventListener("keydown", (e)=>{ if(e.key === "Enter") doLocationSearch(); });

  document.getElementById("use-gps-btn").onclick = ()=>{
    localStorage.removeItem("zad_location");
    renderCurrentLocationLabel();
    showToast("تم التفعيل التلقائي عبر GPS — سيُطبَّق في الصفحة الرئيسية");
  };

  const method = document.getElementById("calc-method");
  method.value = localStorage.getItem("zad_calc_method") || "4";
  method.onchange = ()=>{ localStorage.setItem("zad_calc_method", method.value); showToast("سيتم تطبيق التغيير عند إعادة تحميل الصفحة"); };

  document.getElementById("clear-data").onclick = ()=>{
    localStorage.removeItem("zad_favorites");
    localStorage.removeItem("zad_sadaqa");
    showToast("تم حذف البيانات المحلية");
  };
}
</script>

<script src="js/quran-data.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
