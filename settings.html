<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعدادات | زاد الآخرة</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕌</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<script>
function renderPage(){
  const c = document.getElementById("page-content");
  c.innerHTML = `
    <div class="page-heading">
      <h1>الإعدادات</h1>
      <p>خصّص تجربتك داخل زاد الآخرة</p>
    </div>
    <div class="text-card">
      <h3 style="color:var(--gold-light); margin-bottom:14px;">القارئ الافتراضي</h3>
      <select id="default-reciter" style="width:100%; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-main); padding:12px 16px; border-radius:10px;"></select>
    </div>
    <div class="text-card">
      <h3 style="color:var(--gold-light); margin-bottom:14px;">طريقة حساب مواقيت الصلاة</h3>
      <select id="calc-method" style="width:100%; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-main); padding:12px 16px; border-radius:10px;">
        <option value="4">أم القرى - مكة المكرمة</option>
        <option value="5">الهيئة المصرية العامة للمساحة</option>
        <option value="2">الجمعية الإسلامية لأمريكا الشمالية (ISNA)</option>
        <option value="3">رابطة العالم الإسلامي</option>
      </select>
    </div>
    <div class="text-card">
      <h3 style="color:var(--gold-light); margin-bottom:10px;">إفراغ بيانات الموقع المحلية</h3>
      <p style="color:var(--text-muted); font-size:.85rem; margin-bottom:14px;">يحذف هذا الخيار قائمة المفضلة وأسماء الصدقة الجارية المحفوظة في متصفحك فقط.</p>
      <button class="hero-btn" id="clear-data">حذف البيانات المحلية</button>
    </div>
  `;

  const sel = document.getElementById("default-reciter");
  RECITERS.forEach(r=>{ const o=document.createElement("option"); o.value=r.id; o.textContent=r.name; sel.appendChild(o); });
  sel.value = localStorage.getItem("zad_default_reciter") || RECITERS[0].id;
  sel.onchange = ()=>{ localStorage.setItem("zad_default_reciter", sel.value); showToast("تم الحفظ"); };

  const method = document.getElementById("calc-method");
  method.value = localStorage.getItem("zad_calc_method") || "4";
  method.onchange = ()=>{ localStorage.setItem("zad_calc_method", method.value); showToast("سيتم تطبيق التغيير عند إعادة تحميل الصفحة"); };

  document.getElementById("clear-data").onclick = ()=>{
    localStorage.removeItem("zad_favorites");
    localStorage.removeItem("zad_sadaqa");
    showToast("تم حذف البيانات المحلية");
  };
}
</script>

<script src="js/quran-data.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
